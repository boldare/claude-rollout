# Example rollout. Copy it to $ROLLOUT_ROOT/<name>/manifest.yaml (default ~/.rollouts) and adapt it.
rollout: my-lib-1.2.0
model: opus
# claudeBin: ~/tools/claude # default: claude from PATH
# Set it when claude on PATH is a terminal's wrapper script, such as cmux's shim. preflight warns about one.
# mcpConfig: mcp.json # MCP servers for implement and fix. Default: none, not even yours.

repo:
  path: ~/code/my-lib
  github: my-org/my-lib
  base: main
  # false for a private repo drops the public-repository rules from the prompts. The denylist still applies.
  public: true
  # Put tool versions the repo needs first on PATH (node, pnpm, gh).
  pathPrepend: []
  install: pnpm install --frozen-lockfile
  requiredChecks: ['test*', 'lint']
  # A base commit with no required check run that changes only these paths takes its state from its parent.
  # List only paths your required checks never run on.
  # baseQuietPaths: ['docs/journal/**']
  # Agents act as a separate non-admin account (see docs/accounts.html).
  agentToken: ~/.config/rollout/agent-gh-token
  maintainers: [my-github-login]
  merge: { method: squash, admin: auto }
  neverMerge:
    branches: ['changeset-release/*']
    titles: ['chore: version packages', 'chore: version packages (next)']
  forbid:
    - '**/CHANGELOG.md'
    - .changeset/config.json
    - .github/workflows/release.yml
  # Terms that must never appear in the diff, PR or commits (client names, local paths). The gate checks them on every repo.
  denylist: [acme-client, /Users/]
  # New code scanning alerts on a PR: fix (back to the implementer), block or ignore.
  codeScanning: { action: fix, minSeverity: medium }
  verify:
    common:
      - pnpm install --frozen-lockfile
      - pnpm build
      - pnpm test
      - pnpm lint:fix
      - pnpm lint && pnpm format:check

# Brief writers get these sources. The plan wins over design notes.
briefing:
  sources:
    - title: Plan (authoritative)
      path: ~/.rollouts/my-lib-1.2.0/plan.md
      kind: markdown

policy:
  concurrency: 3
  merge: manual # the driver says "ready", the maintainer merges on GitHub
  approval: github
  maxBump: minor
  attempts: { implement: 2, fix: 4, verify: 3 }
  timeouts: { implement: 240, fix: 120, verify: 90 }
  # Where notices go. Each one goes to every target that is on.
  # notify:
  #   desktop: true
  #   command: logger -t rollout "$2"
  #   webhook: https://hooks.example.com/rollout

# Checks on top of CI, the policy and code scanning: on each brief the driver writes, before the verifier, and by it.
# gates:
#   brief:
#     # The brief reviewer runs the draft's existing commands and reports whether each can pass.
#     runChecks: true
#     # The reviewer checks each brief against these. A required one that does not pass blocks the PR on a brief question.
#     required:
#       - When the PR changes a rule or a behaviour, every file that states the old one is in Expected files.
#   ready:
#     # The implementer runs these before READY, and the driver runs them again before the pre-verify commands. The install goes first.
#     # A failed one sends the PR back.
#     required: [pnpm install --frozen-lockfile, pnpm test]
#     # A failed one sends nothing back. The card, the PR page and the verifier see it.
#     recommended: [pnpm lint]
#   preVerify:
#     # Sends back files outside a PR's scope that its READY report does not list in deviations.
#     scope: true
#     # The driver runs these itself, after the ready commands. A failed one sends the PR back.
#     required: [pnpm build]
#     # A failed one sends nothing back. The card, the PR page and the verifier see it.
#     recommended: [pnpm size]
#   verify:
#     # The verifier checks each one. A required one that does not pass blocks the PR.
#     required:
#       - A new branch in the code has a test that fails without it.
#     # One that does not pass blocks nothing. The card and the PR page show it.
#     recommended:
#       - Every new option has its row in the docs.
#     # Read from the base branch at every verifier launch. Every entry that applies is required.
#     criteriaFrom: docs/criteria.yaml

# Where agents, repo.install and the ready and pre-verify commands run (see docs/manifest.html#sandbox).
# host is the default and runs agents as you. docker runs each one in a container of its own.
# sandbox:
#   runtime: docker
#   # Built by `node $R sandbox build`, never pulled. The image has npm, not pnpm.
#   # Default: rollout-agent:<version of your claude>, the tag sandbox build gives.
#   image: rollout-agent:2.1.309
#   # A Claude Code OAuth token, chmod 600. Or ANTHROPIC_API_KEY in passEnv.
#   oauthTokenFile: claude-token
#   # The only hosts a container reaches. A list here replaces this default.
#   allowedDomains:
#     - api.anthropic.com
#     - statsig.anthropic.com
#     - github.com
#     - api.github.com
#     - objects.githubusercontent.com
#     - codeload.github.com
#     - registry.npmjs.org
#   # Variables of your environment every container gets, such as ANTHROPIC_API_KEY.
#   passEnv: []
#   memory: 4g
#   cpus: 2
#   pidsLimit: 512

prs:
  - id: P1
    branch: feat/config-loader
    title: 'feat: config loader'
    brief: briefs/P1.md # written by the driver when it does not exist
    deps: []
    priority: 10
    effort: { implement: xhigh, verify: xhigh }
    changeset: minor

  - id: P2
    branch: feat/cli-flags
    title: 'feat: cli flags'
    brief: briefs/P2.md
    deps: [P1]
    priority: 5
    effort: { implement: high, verify: high }
    # The implementer and its fixes on sonnet. A second implement attempt or a third fix goes to the rollout model.
    model: { implement: sonnet }
    changeset: minor
    allowWorkflows: true # this PR adds a CI step
